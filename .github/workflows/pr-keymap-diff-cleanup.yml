name: Keymap Diff Preview Cleanup

# When a PR closes (merged or not), drop its preview images from the
# pr-previews branch and remove the preview comment, so nothing accumulates.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: keymap-diff-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      PREVIEW_BRANCH: pr-previews
    steps:
      - name: Remove this PR's preview images
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            work=$(mktemp -d); cd "$work"; git init -q; git remote add origin "$remote"
            if ! git fetch -q --depth 1 origin "$PREVIEW_BRANCH"; then
              echo "no previews branch — nothing to clean"; exit 0
            fi
            git reset -q --hard FETCH_HEAD; git checkout -q -B "$PREVIEW_BRANCH"
            if [ ! -d "$PR" ]; then echo "no previews for #$PR"; exit 0; fi
            git rm -rq "$PR"
            git commit -q -m "remove keymap diff previews for #$PR [skip ci]"
            if git push -q origin "$PREVIEW_BRANCH"; then exit 0; fi
            echo "push race, retrying ($attempt)"; cd /; rm -rf "$work"; sleep 3
          done
          echo "could not clean previews after retries" >&2; exit 1

      - name: Delete the preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const marker = "<!-- keymap-diff-preview -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, per_page: 100,
            });
            for (const c of comments) {
              if (c.body && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id });
              }
            }
