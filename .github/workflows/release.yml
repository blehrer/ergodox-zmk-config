name: Release Firmware

# Build the central firmware from the current keymap and publish it as a
# GitHub release. Every merge into main refreshes a rolling "latest" release
# so the newest build is always the one shown on the repo landing page.
# Pushing a v* tag (or dispatching with a tag) cuts a permanent, versioned
# release alongside it.
# Peripheral firmware is downloaded separately (see the release body).
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = rolling 'latest' prerelease)"
        required: false

permissions:
  contents: write

# One release run per ref. A newer push to main supersedes an in-flight
# "latest" build; tag refs each get their own group and never cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reuse the exact same SliceMK build the CI uses; it uploads the central
  # firmware as an artifact named "firmware" (upload-artifact@v4).
  build:
    uses: slicemk/zmk/.github/workflows/build-user-config.yml@main

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Resolve release target
        id: target
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A pushed v* tag -> permanent versioned release.
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            # Manual dispatch naming a tag -> permanent versioned release.
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            # Merge into main (or blank dispatch) -> rolling "latest" release.
            # A full (non-pre) release so it wins the "Latest" badge on the
            # repo landing page; GitHub hides prereleases from that widget.
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest firmware (main)" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show firmware files
        run: find firmware -type f -print

      # Delete the previous "latest" release + tag so the recreated one points
      # at this commit (a moving tag can't just be overwritten in place).
      - name: Reset rolling latest release
        if: steps.target.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag --yes || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          prerelease: ${{ steps.target.outputs.prerelease }}
          files: firmware/**
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Central firmware (`.uf2`) built from `config/slicemk_ergodox.keymap` at this revision.

            **Flashing:** put the central half/dongle into bootloader mode and copy the matching `.uf2` onto it.

            **Peripheral(s):** GitHub Actions only builds the central — download peripheral firmware separately from the [SliceMK docs](https://docs.slicemk.com/keyboard/ergodox/peripheral/).
