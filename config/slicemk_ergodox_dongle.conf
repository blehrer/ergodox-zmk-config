# If you are using a dongle, custom ZMK configuration options should go in this
# file. If you are not using a dongle (using the left as central), this file is
# ignored.

# Ported settings from Oryx config.h + required ZMK options

# --- Combos ---------------------------------------------------------------
# Position 32 (D) is now the busiest key at 7 combos; ZMK's default cap is 5.
# Set with headroom so adding another D- or K-combo does not silently drop it.
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=12
# Longest combos are 4 keys (A S D F / J K L ;) — equals the default, set explicitly.
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4

# --- Pointer / mouse ------------------------------------------------------
# Required for &mmv, &msc, &mkp (tap dances and the DUAL_FUNC_11 click key).
CONFIG_ZMK_POINTING=y

# --- Debounce -------------------------------------------------------------
# QMK had DEBOUNCE 30. That is very high; 30ms of added latency is noticeable
# on top of the 5-10ms wireless hop. Try 5 first and only raise if you chatter.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- Misc -----------------------------------------------------------------
CONFIG_ZMK_SLEEP=y

